<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Mail App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body { background: #f4f8ff; }
        .app-card { border-radius: 16px; box-shadow: 0 8px 20px rgba(13,110,253,0.08); border: 1px solid #dbe7ff; }
        .table-wrap { border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>
    <nav class="navbar bg-white border-bottom border-primary-subtle">
        <div class="container">
            <a class="navbar-brand fw-semibold text-primary" href="{{ url_for('index') }}">Simple Mail</a>
            {% if user_email %}
            <div class="d-flex gap-2">
                <a class="btn btn-outline-primary rounded-pill px-3" href="{{ url_for('compose') }}">Write</a>
                <a class="btn btn-outline-primary rounded-pill px-3" href="{{ url_for('sent_page') }}">Sent</a>
                <a class="btn btn-outline-primary rounded-pill px-3" href="{{ url_for('received_page') }}">Inbox</a>
                <a class="btn btn-outline-danger rounded-pill px-3"  href="{{ url_for('spam_page') }}">Spam</a>
                <a class="btn btn-outline-secondary rounded-pill px-3" href="{{ url_for('logout') }}">Logout</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container py-4">
        {% if user_email %}
            <div class="mb-3 text-primary-emphasis">Logged in as <b>{{ user_email }}</b></div>
        {% endif %}
        <div class="card app-card bg-white">
            <div class="card-body p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
</body>
</html>
