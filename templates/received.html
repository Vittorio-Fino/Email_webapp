{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary m-0">Inbox</h2>
    <a href="{{ url_for('received_page') }}" class="btn btn-outline-primary rounded-pill px-4">Refresh</a>
</div>
<div class="table-responsive table-wrap border border-primary-subtle">
    <table class="table table-hover align-middle mb-0">
        <thead class="table-primary">
            <tr><th>ID</th><th>From</th><th>Subject</th><th>Body</th><th>Date</th></tr>
        </thead>
        <tbody>
            {% for e in emails %}
            <tr>
                <td>{{ e["id"] }}</td>
                <td>{{ e["sender"] }}</td>
                <td>{{ e["subject"] }}</td>
                <td>{{ e["body"] }}</td>
                <td>{{ e["created_at"] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
