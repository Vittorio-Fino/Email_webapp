{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-primary">Login</h2>
{% if error %}
    <div class="alert alert-danger rounded-3">{{ error }}</div>
{% endif %}
<form method="POST" class="mx-auto" style="max-width: 460px;">
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control rounded-3" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control rounded-3" required />
    </div>
    <button type="submit" class="btn btn-primary rounded-pill px-4">Login</button>
</form>
<p class="mt-3">No account? <a href="{{ url_for('register') }}">Register</a></p>
{% endblock %}
