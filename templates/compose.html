{% extends "base.html" %}
{% block content %}
<h2 class="mb-4 text-primary">Write Email</h2>

<form method="POST" class="mx-auto" style="max-width: 760px;">
    <div class="mb-3">
        <label class="form-label">From</label>
        <input type="email" value="{{ user_email }}" class="form-control rounded-3" disabled />
    </div>

    <div class="mb-3">
        <label class="form-label">To</label>
        <input type="email" name="recipient" class="form-control rounded-3" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Subject</label>
        <input type="text" name="subject" class="form-control rounded-3" required />
    </div>

    <div class="mb-3">
        <label class="form-label">Body</label>
        <textarea name="body" rows="10" class="form-control rounded-3" required></textarea>
    </div>

    <button type="submit" class="btn btn-primary rounded-pill px-4">Send</button>
</form>
{% endblock %}
